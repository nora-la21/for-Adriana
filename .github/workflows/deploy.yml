name: Deploy prototype to GitHub Pages

# Publishes the clickable prototype to a real URL:
#   https://<owner>.github.io/<repo>/
#
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
# Until that is switched on, this workflow will fail at the deploy step.

on:
  push:
    branches:
      - claude/body-temple-app-mvp-fttuk0
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        # Pages serves the site from /<repo>/, so asset URLs need that prefix.
        env:
          APP_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Bundle single-file prototype
        run: node scripts/bundle-single.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
